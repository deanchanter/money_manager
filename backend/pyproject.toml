[project]
name = "money-manager-backend"
version = "1.0.0"
description = "Personal finance management API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "python-multipart>=0.0.6",
    "pandas>=2.1.3",
    "pydantic>=2.5.2",
    "python-dateutil>=2.8.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
start = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
package = true
